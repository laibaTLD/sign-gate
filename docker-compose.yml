version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: sign-gate-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sign-gate-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/${MONGO_DB_NAME:-sign-gate}
      - NODE_ENV=${NODE_ENV:-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - mongodb
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sign-gate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
