docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
adminEmails               info@usbrandbooster.com
enableGzip                1
enableIpGeo               1

################################
# ACCESS CONTROL - Tailscale Only
################################

accessControl  {
  allow                   100.64.0.0/10
  allow                   127.0.0.1
  deny                    ALL
}

index  {
  useServer               0
  indexFiles              index.html
}

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1

  rewrite  {
     enable               0
  }
  addDefaultCharset       off

  phpIniOverride  {

  }
}

##########################
# Sign-Gate Backend API
##########################

extprocessor signgate_backend {
  type                    proxy
  address                 127.0.0.1:5050
  maxConns                100
  initTimeout             60
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      60
  respBuffer              0
}

context /api {
  type                    proxy
  handler                 signgate_backend
  allowBrowse             1

  rewrite  {
    enable                0
  }

  phpIniOverride  {

  }
}

##########################
# Sign-Gate Frontend
##########################

extprocessor signgate_frontend {
  type                    proxy
  address                 127.0.0.1:3030
  maxConns                100
  initTimeout             60
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      60
  respBuffer              0
}

context / {
  type                    proxy
  handler                 signgate_frontend
  allowBrowse             1

  rewrite  {
    enable                0
  }

  phpIniOverride  {

  }
}

vhssl  {
  keyFile                 /etc/letsencrypt/live/autoseoservices.com/privkey.pem
  certFile                /etc/letsencrypt/live/autoseoservices.com/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling          1
  ocspRespMaxAge          86400
}
